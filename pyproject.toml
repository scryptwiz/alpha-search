[project]
name = "alpha-search"
version = "0.1.0"
description = "Search the Alpha reading list and fetch the matching articles."
readme = "README.md"
authors = [
    { name = "Kelvin Ajayi", email = "68742854+scryptwiz@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openai>=3.58.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
alpha-search = "alpha_search:main"

[dependency-groups]
dev = ["ipykernel>=7"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
